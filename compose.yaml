services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventuser -d eventdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./demo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eventdb
      SPRING_DATASOURCE_USERNAME: eventuser
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local-demo-only}
      JWT_SECRET: ${JWT_SECRET:?Imposta JWT_SECRET con un valore privato di almeno 64 byte}

  frontend:
    build: ./event-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
